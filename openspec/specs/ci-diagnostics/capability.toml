family = "verification"
primary_invariant = "One repository-owned graph proves product quality with pristine cross-platform output."
routing_question = "Does this change alter verification composition, diagnostic cleanliness, coverage, or hosted execution portability?"
decision_axes = ["lifecycle", "surface", "authority"]
boundary_rules = [
  "Nox owns verification composition and uv.lock owns Python tool resolution.",
  "Expected test disconnects are suppressed only at the fixture boundary.",
  "Forge jobs project repository-owned commands instead of owning product or release semantics.",
]
aliases = []

[owner]
package = "codex-responses-proxy"
scope = "Repository-owned local and hosted verification diagnostics"

[recommended_facets]
lifecycle = ["validation"]
surface = ["test", "quality", "ci", "docs", "openspec"]
authority = ["source", "test", "docs", "openspec"]

[proof_profile]
default_command = "ethos prove --json"
executed_command = "ethos prove --execute --expect-head <head> --json"
required_gates = ["python-quality", "platform-matrix"]
