family = "quality"
primary_invariant = "A successful CI job contains no unhandled Python traceback or warning."
routing_question = "Does this change alter test diagnostics, quality output, or Forge verification logs?"
decision_axes = ["lifecycle", "surface", "authority"]
boundary_rules = [
  "Production resources are closed by their production owner.",
  "Expected test disconnects are suppressed only at the fixture boundary.",
  "Forge jobs project repository-owned commands instead of duplicating them.",
]
aliases = []

[owner]
package = "codex-dmx-proxy"
scope = "Python diagnostic integrity across tests, quality gates, and Forge projections"

[recommended_facets]
lifecycle = ["validation", "release"]
surface = ["test", "quality", "ci", "docs", "openspec"]
authority = ["source", "test", "docs", "openspec", "claim", "evidence"]

[proof_profile]
default_command = "ethos prove --json"
executed_command = "ethos prove --execute --expect-head <head> --json"
required_gates = ["python-quality", "platform-matrix"]
