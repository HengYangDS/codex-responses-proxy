schema_version = 1
id = "change:portable-release-signing"
intent = "Unify release signing on one explicit private-key file boundary and remove platform-dependent temporary key materialization."
subjects = ["repository:self"]
scope = [
  "openspec/changes/portable-release-signing/**",
  "openspec/changes/archive/*-portable-release-signing/**",
  ".github/workflows/verify.yml",
  "docs/operations/forge-operations.md",
  "tests/forge/test_workflow_contracts.py",
  "tests/release/test_assets.py",
  "tools/release/assemble_assets.py",
  "tools/release/signing.py",
]
invariants = [
  "gitlab_and_github_remain_independent_publication_endpoints",
  "private_key_material_is_owned_and_permissioned_by_the_secret_provider",
