minimum_percent = 95.0
comparison = "at-least"
threshold_scopes = ["aggregate"]
package_observation = "required"
metrics = ["statement", "branch"]
owner = "repository-quality"
source = "coverage.py exact statement and branch counts"
risk_model = "broad unobserved protocol or lifecycle control-flow or a wholly unexecuted semantic package can corrupt a replay service transition or release without an observable regression"
measurement = "exact aggregate statement and branch counts plus non-zero execution evidence and diagnostic ratios for every semantic package"
false_positive_cost = "aggregate floors can still encourage low-risk tests while package and file ratios are too volatile to act as independent vetoes"
remediation = "test meaningful behavior remove unreachable code or simplify the responsible semantic package; exclusions are not accepted"
review_condition = "reassess when escaped defects show the aggregate and package-observation model misses a stable risk boundary or when three legitimate changes are blocked only by the aggregate denominator"
