owner = "repository-quality"
risk_model = "unstructured commit subjects make release history difficult to search, automate, and audit across independent publication planes"
measurement = "parse each governed commit subject against the tracked type, scope, and concise subject grammar"
false_positive_cost = "a legitimate new semantic scope requires an intentional policy update before the commit can enter published history"
remediation = "choose the nearest existing semantic scope or add one reviewed scope with the behavior that needs it"
review_condition = "reassess when the product gains a durable semantic owner or two legitimate commits in one release train need the same missing scope"
types = ["build", "chore", "ci", "docs", "feat", "fix", "perf", "refactor", "revert", "spec", "test"]
scopes = ["architecture", "cli", "docs", "forge", "governance", "install", "lifecycle", "openspec", "protocol", "providers", "quality", "relay", "release", "runtime", "service", "supervision", "tests"]
