owner = "repository-quality"
risk_model = "undeclared package owners and dependency edges create hidden coupling, ambiguous authority, and non-local change risk"
measurement = "parse the declared product package, imports, root modules, package declarations, and dependency cycles against this contract"
false_positive_cost = "a legitimate new semantic owner or dependency requires an intentional policy update reviewed with the implementation"
remediation = "move behavior to an existing owner or declare the new owner and dependency here with focused contract tests"
review_condition = "reassess when the product topology changes or two legitimate changes in one release train are blocked by the same contract"
source_roots = ["src/codex_responses_proxy", "tools"]
test_roots = ["tests"]
package_root = "src/codex_responses_proxy"
root_configuration_modules = ["noxfile.py"]
package_root_modules = ["errors", "json_value", "product_identity"]
package_initializers = "declarations-only"

[allowed_package_edges]
cli = ["errors", "lifecycle", "product_identity", "service"]
lifecycle = [
  "errors",
  "json_value",
  "product_identity",
  "protocol",
  "providers",
  "relay",
  "runtime",
  "service",
]
protocol = []
providers = []
relay = ["protocol", "providers", "runtime"]
service = [
  "json_value",
  "product_identity",
  "protocol",
  "providers",
  "relay",
  "runtime",
]
runtime = ["product_identity"]
