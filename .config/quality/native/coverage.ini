[run]
branch = True
source_pkgs = codex_responses_proxy, noxfile
source_dirs = tools

[paths]
product =
    src/codex_responses_proxy
    .nox/*/lib/python*/site-packages/codex_responses_proxy
    .nox/*/Lib/site-packages/codex_responses_proxy

[report]
show_missing = True
precision = 2
include_namespace_packages = True
exclude_also =
    if __name__ == .__main__.:
