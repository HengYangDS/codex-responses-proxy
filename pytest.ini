[pytest]
addopts = --import-mode=importlib --strict-config --strict-markers
cache_dir = .cache/pytest
filterwarnings = error
markers =
    native_distribution: requires the self-contained released executable
    performance: deterministic product benchmark isolated from third-party latency
    repository_toolchain: requires the repository-locked external toolchain
testpaths = tests
python_classes = Test* *Tests *Contracts
