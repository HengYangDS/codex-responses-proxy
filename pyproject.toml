[tool.codex-dmx-proxy]
distribution = "runtime-files"
requires-python = ">=3.12"
version-source = "VERSION"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.format]
docstring-code-format = true
line-ending = "lf"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E402"]

[tool.ty.environment]
extra-paths = [".", "scripts", "tests"]

[tool.coverage.run]
branch = true
source = ["codex_dmx_proxy"]
omit = ["*/__init__.py"]

[tool.coverage.report]
show_missing = true
precision = 2
fail_under = 95
exclude_also = ["if __name__ == .__main__.:"]

[tool.codex-dmx-proxy.quality]
logic-max-statements = 600
test-max-statements = 800
source-roots = ["*.py", "codex_dmx_proxy", "watchdog", "scripts"]
test-roots = ["tests"]
