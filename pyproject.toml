[tool.codex-responses-proxy]
distribution = "runtime-files"
requires-python = ">=3.12"
version-source = "VERSION"

[dependency-groups]
quality = ["coverage==7.15.2", "ruff==0.16.1", "ty==0.0.65"]

[tool.uv]
package = false
required-version = "==0.12.1"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.format]
docstring-code-format = true
line-ending = "lf"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E402"]

[tool.ty.environment]
extra-paths = [".", "tools", "tests"]

[tool.coverage.run]
branch = true
source = ["codex_responses_proxy"]
omit = ["*/__init__.py"]

[tool.coverage.report]
show_missing = true
precision = 2
fail_under = 95
exclude_also = ["if __name__ == .__main__.:"]

[tool.codex-responses-proxy.quality]
logic-max-statements = 600
test-max-statements = 800
module-max-eloc = 600
function-max-eloc = 120
max-nesting-depth = 8
source-roots = ["codex_responses_proxy", "tools"]
test-roots = ["tests"]
