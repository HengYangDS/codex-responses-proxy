[build-system]
requires = ["hatchling==1.32.3"]
build-backend = "hatchling.build"

[project]
name = "codex-responses-proxy"
dynamic = ["version"]
description = "Provider-portable compatibility gateway for Codex Responses traffic."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "certifi==2026.7.22",
  "cyclopts==4.25.3",
  "filelock==3.32.7",
  "psutil==7.2.2",
  "rich==15.0.0",
]

[project.scripts]
codex-responses-proxy = "codex_responses_proxy.cli.application:main"

[tool.codex-responses-proxy]
distribution = "native-executable"
linux-release-image = "python:3.14.7-bookworm@sha256:ecac9e212daacda8a702eae372fceebc0ee36f5805abe087880367e8d061fa5b"

[dependency-groups]
quality = [
  "coverage==7.16.1",
  "deptry==0.25.1",
  "hatchling==1.32.3",
  "nox==2026.8.17",
  "pyperf==2.10.0",
  "pytest==9.1.1",
  "pytest-mock==3.15.1",
  "pytest-subtests==0.15.0",
  "pyyaml==6.0.3",
  "ruff==0.16.8",
  "ty==0.0.82",
  "vulture==2.16",
]
release = ["pyinstaller==6.22.3"]

[tool.uv]
required-version = "==0.12.15"
link-mode = "copy"

[tool.deptry]
known_first_party = ["codex_responses_proxy"]
package_module_name_map = { pyinstaller = ["PyInstaller"] }

[tool.hatch.version]
path = "VERSION"
pattern = "(?P<version>[^\\s]+)"

[tool.hatch.build.targets.sdist]
include = ["/src/codex_responses_proxy", "/VERSION", "/README.md", "/LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["src/codex_responses_proxy"]
