[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "codex-responses-proxy"
dynamic = ["version"]
description = "Provider-portable compatibility gateway for Codex Responses traffic."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "certifi==2026.7.22",
  "cyclopts==4.23.3",
  "filelock==3.32.5",
  "psutil==7.2.2",
  "rich==15.0.0",
]

[project.scripts]
codex-responses-proxy = "codex_responses_proxy.cli.application:main"

[tool.codex-responses-proxy]
distribution = "native-executable"
linux-release-image = "python:3.14.7-bookworm@sha256:8771427e2ac3e39208c1632f17e8b09e464333d262844a03705cc5e0023c16e2"

[dependency-groups]
quality = [
  "coverage==7.16.0",
  "deptry==0.25.1",
  "hatchling==1.32.0",
  "nox==2026.8.17",
  "pyperf==2.10.0",
  "pytest==9.1.1",
  "pytest-mock==3.15.1",
  "pytest-subtests==0.15.0",
  "pyyaml==6.0.3",
  "ruff==0.16.5",
  "ty==0.0.75",
  "vulture==2.16",
]
release = ["pyinstaller==6.22.2"]

[tool.uv]
required-version = "==0.12.7"
link-mode = "copy"

[tool.deptry]
known_first_party = ["codex_responses_proxy"]
package_module_name_map = { pyinstaller = ["PyInstaller"] }

[tool.hatch.version]
path = "VERSION"
pattern = "(?P<version>[^\\s]+)"

[tool.hatch.build.targets.sdist]
include = ["/src/codex_responses_proxy", "/VERSION", "/README.md", "/LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["src/codex_responses_proxy"]
