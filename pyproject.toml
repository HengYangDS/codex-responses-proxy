[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "codex-responses-proxy"
dynamic = ["version"]
description = "Provider-portable compatibility gateway for Codex Responses traffic."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["psutil==7.2.2"]

[project.scripts]
codex-responses-proxy = "codex_responses_proxy.cli.application:main"

[tool.codex-responses-proxy]
distribution = "native-executable"

[dependency-groups]
quality = [
    "coverage==7.15.3",
    "hatchling==1.31.0",
    "nox==2026.7.11",
    "pyinstaller==6.21.0",
    "pytest==9.1.1",
    "pytest-mock==3.15.1",
    "pytest-subtests==0.15.0",
    "ruff==0.16.1",
    "ty==0.0.67",
]

[tool.uv]
required-version = "==0.12.2"
link-mode = "copy"

[tool.hatch.version]
path = "VERSION"
pattern = "(?P<version>[^\\s]+)"

[tool.hatch.build.targets.sdist]
include = ["/src/codex_responses_proxy", "/VERSION", "/README.md", "/LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["src/codex_responses_proxy"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.format]
docstring-code-format = true
line-ending = "lf"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib", "--strict-config", "--strict-markers"]
filterwarnings = ["error"]
markers = ["native_distribution: requires the self-contained released executable"]
testpaths = ["tests"]
python_classes = ["Test*", "*Tests", "*Contracts"]

[tool.ty.environment]
extra-paths = ["src", "."]

[tool.coverage.run]
branch = true
source_pkgs = ["codex_responses_proxy"]
omit = ["*/__init__.py"]

[tool.coverage.report]
show_missing = true
precision = 2
fail_under = 95
exclude_also = ["if __name__ == .__main__.:"]

[tool.codex-responses-proxy.quality]
logic-max-statements = 600
test-max-statements = 800
module-max-eloc = 600
function-max-eloc = 120
max-nesting-depth = 8
source-roots = ["src/codex_responses_proxy", "tools"]
test-roots = ["tests"]
