workflow:
  rules:
    # A release candidate is validated by its signed tag. Suppress the
    # necessarily untagged preparation branch so an incomplete publication is
    # never represented as a passing mainline release.
    - if: '$CI_COMMIT_BRANCH =~ /^release\// && !$CI_COMMIT_TAG'
      when: never
    - if: '$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME =~ /^release\//'
      when: never
    - when: always

stages:
  - verify
  - release

variables:
  DEBIAN_FRONTEND: noninteractive
  CODEX_RESPONSES_PROXY_RELEASE_TAG_REMOTE: origin
  UV_PYTHON_FLOOR_IMAGE: ghcr.io/astral-sh/uv:0.12.5-python3.12-trixie-slim@sha256:4677e08839853fe91c523b593f822ec1e87c7b91ba4c6b30929016b2e0933cd5
  UV_PYTHON_LATEST_IMAGE: ghcr.io/astral-sh/uv:0.12.5-python3.14-trixie-slim@sha256:dc360d7e5f968c682e8b59e83027a315a0232dead15cb9dfe3e707a12ba390e1
  UV_CACHE_DIR: $CI_PROJECT_DIR/.cache/uv
  UV_PYTHON_INSTALL_DIR: $CI_PROJECT_DIR/.cache/uv/python
  CODEX_RESPONSES_PROXY_CI_TARGET: linux-amd64
  LINUX_RELEASE_IMAGE: python:3.14.7-bookworm@sha256:8771427e2ac3e39208c1632f17e8b09e464333d262844a03705cc5e0023c16e2

default:
  image:
    name: $UV_PYTHON_LATEST_IMAGE
    docker: { platform: linux/amd64 }
  tags: [$CODEX_RESPONSES_PROXY_GITLAB_LINUX_RUNNER_TAG]
  cache:
    key: uv-$CODEX_RESPONSES_PROXY_CI_TARGET
    paths: [.cache/uv/]

.uv-runtime-contract:
  before_script:
    - &assert-uv-version |
      UV_REQUIREMENT="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["tool"]["uv"]["required-version"])')"
      UV_VERSION="$(uv --version)"
      UV_VERSION="${UV_VERSION#uv }"
      ACTUAL_UV_VERSION="${UV_VERSION%% *}"
      EXPECTED_UV_VERSION="${UV_REQUIREMENT#==}"
      if [ "$ACTUAL_UV_VERSION" != "$EXPECTED_UV_VERSION" ]; then
        printf 'uv version mismatch: expected %s, actual %s\n' "$EXPECTED_UV_VERSION" "$ACTUAL_UV_VERSION" >&2
        exit 1
      fi

.release-uv-bootstrap:
  before_script:
    - &install-uv |
      UV_REQUIREMENT="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["tool"]["uv"]["required-version"])')"
      python -m pip install --disable-pip-version-check --no-cache-dir --root-user-action=ignore "uv${UV_REQUIREMENT}"

verify-python-matrix:
  stage: verify
  variables:
    # The canonical test inventory includes release chronology contracts.
    # Every matrix interpreter therefore needs the same complete Git history.
    GIT_DEPTH: "0"
  before_script:
    - *assert-uv-version
    - apt-get update -qq
    # PyInstaller inspects native objects with objdump on Linux.  Keep that
    # platform dependency explicit instead of relying on a runner image layer.
    - apt-get install -qq -y --no-install-recommends binutils git openssh-client
    - if [ "$(git rev-parse --is-shallow-repository)" = true ]; then git fetch --unshallow --tags --force origin; else git fetch --tags --force origin; fi
  script:
    - python --version
    - uv sync --locked --group quality --no-install-project --python python --no-python-downloads
    - uv python install $(tr '\n' ' ' < .python-versions)
    - uv run --locked --no-sync --python python --no-python-downloads nox -s full

verify-release-metadata:
  stage: verify
  variables:
    # Release chronology compares the whole provider tag namespace. A shallow
    # checkout cannot establish that history, so this job must receive it.
    GIT_DEPTH: "0"
  before_script:
    - *assert-uv-version
    - apt-get update -qq
    - apt-get install -qq -y --no-install-recommends git openssh-client
    # Shared runners can retain deleted tags in a reused checkout.  Fetching
    # with tag pruning makes the checker reason about the provider's current
    # release namespace, not runner-local history.
    - git fetch --tags --force --prune --prune-tags origin
    - uv sync --locked --group quality --no-install-project --python python --no-python-downloads
  script:
    - |
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        uv run --locked --no-sync --python python --no-python-downloads python tools/release/metadata.py --provider gitlab --tag "$CI_COMMIT_TAG"
      elif git show-ref --verify --quiet "refs/tags/v$(cat VERSION)"; then
        uv run --locked --no-sync --python python --no-python-downloads python tools/release/metadata.py --provider gitlab
      else
        uv run --locked --no-sync --python python --no-python-downloads python tools/release/metadata.py --provider gitlab --prepare-release
      fi
    - uv run --locked --no-sync --python python --no-python-downloads python -m pytest -q tests/release/test_metadata.py
    - uv run --locked --no-sync --python python --no-python-downloads python -m tools.quality.repository
    - uv run --locked --no-sync --python python --no-python-downloads python -m pytest -q tests/release/test_publish_gitlab.py
    - uv run --locked --no-sync --python python --no-python-downloads python -m pytest -q tests/forge/test_workflow_contracts.py tests/forge/test_tagging.py

verify-release-tag:
  stage: release
  variables: { GIT_DEPTH: "0" }
  rules:
    - if: '$CI_COMMIT_TAG'
  before_script:
    - *assert-uv-version
    - apt-get update -qq
    - apt-get install -qq -y --no-install-recommends git openssh-client
    - git fetch --tags --force --prune --prune-tags origin
    - test -f "${CODEX_RESPONSES_PROXY_GITLAB_TAG_TRUST:-}"
    - uv sync --locked --group quality --no-install-project --python python --no-python-downloads
  script:
    - uv run --locked --no-sync --python python --no-python-downloads python tools/release/metadata.py --provider gitlab --tag "$CI_COMMIT_TAG"
    - uv run --locked --no-sync --python python --no-python-downloads python -m tools.forge.tag_signature . "$CI_COMMIT_TAG" gitlab "$CODEX_RESPONSES_PROXY_GITLAB_TAG_TRUST"

verify-python-quality:
  stage: verify
  image:
    name: $UV_PYTHON_FLOOR_IMAGE
    docker: { platform: linux/amd64 }
  variables:
    # The canonical quality suite also executes release chronology tests.
    # Keep this checkout equivalent to every other full-suite job.
    GIT_DEPTH: "0"
  before_script:
    - *assert-uv-version
    - apt-get update -qq
    - apt-get install -qq -y --no-install-recommends binutils git openssh-client
    - if [ "$(git rev-parse --is-shallow-repository)" = true ]; then git fetch --unshallow --tags --force origin; else git fetch --tags --force origin; fi
  script:
    - uv sync --locked --group quality --no-install-project --python python --no-python-downloads
    - uv run --locked --no-sync --python python --no-python-downloads nox -s quality

build-gitlab-native-asset:
  stage: release
  image:
    name: $LINUX_RELEASE_IMAGE
    docker: { platform: linux/amd64 }
  variables: { GIT_DEPTH: "0" }
  rules:
    - if: '$CI_COMMIT_TAG'
  before_script:
    - git fetch --tags --force --prune --prune-tags origin
    - test "$(uname -m)" = x86_64
    - *install-uv
    - install -d /workspace
    - git archive --format=tar HEAD | tar -xf - -C /workspace
    - cd /workspace
    - uv sync --locked --only-group quality --python python --no-python-downloads
  script:
    - cd /workspace
    - uv run --locked --no-sync --python python --no-python-downloads nox -s release -- "$CI_PROJECT_DIR/.release-assets"
  artifacts:
    name: "gitlab-native-$CI_COMMIT_TAG-linux-x86_64"
    paths: [.release-assets/]
    expire_in: 7 days

publish-gitlab-release:
  stage: release
  image:
    name: $LINUX_RELEASE_IMAGE
    docker: { platform: linux/amd64 }
  variables: { GIT_DEPTH: "0" }
  needs:
    - build-gitlab-native-asset
    - verify-python-matrix
    - verify-release-metadata
    - verify-release-tag
    - verify-python-quality
  rules:
    - if: '$CI_COMMIT_TAG'
  before_script:
    - git fetch --tags --force --prune --prune-tags origin
    - *install-uv
    - uv sync --locked --group quality --python python --no-python-downloads
  script:
    - uv run --locked --no-sync --python python --no-python-downloads python tools/release/metadata.py --provider gitlab --tag "$CI_COMMIT_TAG"
    - test -f "${CODEX_RESPONSES_PROXY_RELEASE_ASSET_SIGNING_KEY:-}"
    - test -n "${CODEX_RESPONSES_PROXY_RELEASE_ASSET_TRUST:-}"
    - uv run --locked --no-sync --python python --no-python-downloads python -m tools.release.publish_gitlab --api-base "$CI_API_V4_URL" --project-id "$CI_PROJECT_ID" --tag "$CI_COMMIT_TAG" --token "$CI_JOB_TOKEN" --assets "$CI_PROJECT_DIR/.release-assets" --signing-key "$CODEX_RESPONSES_PROXY_RELEASE_ASSET_SIGNING_KEY" --trust "$CODEX_RESPONSES_PROXY_RELEASE_ASSET_TRUST"
