workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
stages:
  - verify
  - release
variables:
  DEBIAN_FRONTEND: noninteractive
  CODEX_RESPONSES_PROXY_RELEASE_TAG_REMOTE: origin
  UV_PYTHON_FLOOR_IMAGE: ghcr.io/astral-sh/uv:0.12.21-python3.12-trixie-slim@sha256:5ae92e4d35b8d586d50ddf4aba6ecdd9f744237284d31c86bf45077e4e17e4bd
  UV_PYTHON_LATEST_IMAGE: ghcr.io/astral-sh/uv:0.12.21-python3.14-trixie-slim@sha256:8f4ab6a0f2cc074290ba6a136eb016350b2b6b93a2108e07b72724901ad1914f
  UV_CACHE_DIR: $CI_PROJECT_DIR/.cache/uv
  UV_PYTHON_INSTALL_DIR: $CI_PROJECT_DIR/.cache/uv/python
  CODEX_RESPONSES_PROXY_CI_TARGET: linux-arm64
default:
  image:
    name: $UV_PYTHON_LATEST_IMAGE
  tags:
    - $CODEX_RESPONSES_PROXY_GITLAB_LINUX_RUNNER_TAG
  cache:
    key: uv-$CODEX_RESPONSES_PROXY_CI_TARGET-$CI_COMMIT_REF_PROTECTED
    paths:
      - .cache/uv/
source-and-governance:
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
  tags:
    - $CODEX_RESPONSES_PROXY_GITLAB_LINUX_RUNNER_TAG
  stage: verify
  image:
    name: ghcr.io/jdx/mise:2026.9.18-debian@sha256:33d301fd5929d6960c102f947e97f08c671ad936573b375fcf4f13a90466f710
    entrypoint:
      - ""
  variables:
    GIT_DEPTH: "0"
    MISE_ENABLE_TOOLS: python,uv,node,npm,cue,aqua:tamasfe/taplo,github:gitleaks/gitleaks,github:rhysd/actionlint,github:lycheeverse/lychee
  before_script:
    - apt-get update -qq
    - apt-get install -qq -y --no-install-recommends libatomic1
    - mise install --locked
    - npm ci --ignore-scripts
    - npm audit signatures
    - git fetch --tags --force --prune --prune-tags origin
    - mise exec --locked -- uv sync --locked --group quality --python python --no-python-downloads
  script:
    - export CODEX_RESPONSES_PROXY_COMMIT_BASE="${CI_MERGE_REQUEST_DIFF_BASE_SHA:-$CI_COMMIT_BEFORE_SHA}" CODEX_RESPONSES_PROXY_COMMIT_HEAD="$CI_COMMIT_SHA"; if [ -n "$CI_COMMIT_TAG" ]; then export CODEX_RESPONSES_PROXY_COMMIT_BASE="$CI_COMMIT_SHA"; fi; mise exec --locked -- uv run --locked --no-sync --python python --no-python-downloads python -m tools.quality.governance --online-links
source-and-governance-review:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "dev"
  tags:
    - $CODEX_RESPONSES_PROXY_GITLAB_LINUX_REVIEW_RUNNER_TAG
  stage: verify
  image:
    name: ghcr.io/jdx/mise:2026.9.18-debian@sha256:33d301fd5929d6960c102f947e97f08c671ad936573b375fcf4f13a90466f710
    entrypoint:
      - ""
  variables:
    GIT_DEPTH: "0"
    MISE_ENABLE_TOOLS: python,uv,node,npm,cue,aqua:tamasfe/taplo,github:gitleaks/gitleaks,github:rhysd/actionlint,github:lycheeverse/lychee
  before_script:
    - apt-get update -qq
    - apt-get install -qq -y --no-install-recommends libatomic1
    - mise install --locked
    - npm ci --ignore-scripts
    - npm audit signatures
    - git fetch --tags --force --prune --prune-tags origin
    - mise exec --locked -- uv sync --locked --group quality --python python --no-python-downloads
  script:
    - export CODEX_RESPONSES_PROXY_COMMIT_BASE="${CI_MERGE_REQUEST_DIFF_BASE_SHA:-$CI_COMMIT_BEFORE_SHA}" CODEX_RESPONSES_PROXY_COMMIT_HEAD="$CI_COMMIT_SHA"; if [ -n "$CI_COMMIT_TAG" ]; then export CODEX_RESPONSES_PROXY_COMMIT_BASE="$CI_COMMIT_SHA"; fi; mise exec --locked -- uv run --locked --no-sync --python python --no-python-downloads python -m tools.quality.governance --online-links
verify-python:
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
  tags:
    - $CODEX_RESPONSES_PROXY_GITLAB_LINUX_RUNNER_TAG
  stage: verify
  parallel:
    matrix:
      - PYTHON_VERSION:
          - "3.12"
          - "3.13"
          - "3.14"
  variables:
    GIT_DEPTH: "0"
  before_script:
    - |-
      UV_REQUIREMENT="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["tool"]["uv"]["required-version"])')"
      UV_VERSION="$(uv --version)"
      UV_VERSION="${UV_VERSION#uv }"
      ACTUAL_UV_VERSION="${UV_VERSION%% *}"
      EXPECTED_UV_VERSION="${UV_REQUIREMENT#==}"
      if [ "$ACTUAL_UV_VERSION" != "$EXPECTED_UV_VERSION" ]; then
        printf 'uv version mismatch: expected %s, actual %s
      ' "$EXPECTED_UV_VERSION" "$ACTUAL_UV_VERSION" >&2
        exit 1
      fi
    - apt-get update -qq
    - apt-get install -qq -y --no-install-recommends git openssh-client
    - apt-get install -qq -y --no-install-recommends binutils
    - git fetch --tags --force --prune --prune-tags origin
    - uv sync --locked --group quality --python python --no-python-downloads
    - uv python install --no-bin $PYTHON_VERSION
  script:
    - python --version
    - uv run --locked --no-sync --python python --no-python-downloads nox -s "tests-$PYTHON_VERSION"
