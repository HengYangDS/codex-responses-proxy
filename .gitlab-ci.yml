workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
stages:
  - verify
  - release
variables:
  DEBIAN_FRONTEND: noninteractive
  CODEX_RESPONSES_PROXY_RELEASE_TAG_REMOTE: origin
  UV_PYTHON_FLOOR_IMAGE: ghcr.io/astral-sh/uv:0.12.5-python3.12-trixie-slim@sha256:704e5d5bc0bdba1de51619213bbc802207c1edeecc52c4e91e55b64ccb54ef71
  UV_PYTHON_LATEST_IMAGE: ghcr.io/astral-sh/uv:0.12.5-python3.14-trixie-slim@sha256:fb5e0cc346c27c75a96bec8bede188d91f587534b64f5e12e1626a9dae18c0cf
  UV_CACHE_DIR: $CI_PROJECT_DIR/.cache/uv
  UV_PYTHON_INSTALL_DIR: $CI_PROJECT_DIR/.cache/uv/python
  CODEX_RESPONSES_PROXY_CI_TARGET: linux-arm64
default:
  image:
    name: $UV_PYTHON_LATEST_IMAGE
  tags:
    - $CODEX_RESPONSES_PROXY_GITLAB_LINUX_RUNNER_TAG
  cache:
    key: uv-$CODEX_RESPONSES_PROXY_CI_TARGET
    paths:
      - .cache/uv/
source-and-governance:
  stage: verify
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "dev"
    - if: $CI_COMMIT_BRANCH == "dev"
  image:
    name: ghcr.io/jdx/mise@sha256:f2d637d5e5189f7ec177b73bce5cd5db7e7b17a4f466f887c1b88ac2dd431129
    entrypoint:
      - ""
  variables:
    GIT_DEPTH: "0"
    MISE_ENABLE_TOOLS: python,uv,node,cue,aqua:tamasfe/taplo,github:gitleaks/gitleaks,github:rhysd/actionlint,github:lycheeverse/lychee
  before_script:
    - mise install --locked
    - npm ci --ignore-scripts
    - npm audit signatures
    - git fetch --tags --force --prune --prune-tags origin
    - mise exec --locked -- uv sync --locked --group quality --python python --no-python-downloads
  script:
    - mise exec --locked -- uv run --locked --no-sync --python python --no-python-downloads python -m tools.quality.governance --online-links
verify-python:
  stage: verify
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "dev"
    - if: $CI_COMMIT_BRANCH == "dev"
  parallel:
    matrix:
      - PYTHON_VERSION:
          - "3.12"
          - "3.13"
          - "3.14"
  variables:
    GIT_DEPTH: "0"
  before_script:
    - |-
      UV_REQUIREMENT="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["tool"]["uv"]["required-version"])')"
      UV_VERSION="$(uv --version)"
      UV_VERSION="${UV_VERSION#uv }"
      ACTUAL_UV_VERSION="${UV_VERSION%% *}"
      EXPECTED_UV_VERSION="${UV_REQUIREMENT#==}"
      if [ "$ACTUAL_UV_VERSION" != "$EXPECTED_UV_VERSION" ]; then
        printf 'uv version mismatch: expected %s, actual %s
      ' "$EXPECTED_UV_VERSION" "$ACTUAL_UV_VERSION" >&2
        exit 1
      fi
    - apt-get update -qq
    - apt-get install -qq -y --no-install-recommends git openssh-client
    - apt-get install -qq -y --no-install-recommends binutils
    - git fetch --tags --force --prune --prune-tags origin
    - uv sync --locked --group quality --python python --no-python-downloads
    - uv python install --no-bin $PYTHON_VERSION
  script:
    - python --version
    - uv run --locked --no-sync --python python --no-python-downloads nox -s "tests-$PYTHON_VERSION"
verify-python-quality:
  stage: verify
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "dev"
    - if: $CI_COMMIT_BRANCH == "dev"
  image:
    name: $UV_PYTHON_FLOOR_IMAGE
  variables:
    GIT_DEPTH: "0"
  before_script:
    - |-
      UV_REQUIREMENT="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["tool"]["uv"]["required-version"])')"
      UV_VERSION="$(uv --version)"
      UV_VERSION="${UV_VERSION#uv }"
      ACTUAL_UV_VERSION="${UV_VERSION%% *}"
      EXPECTED_UV_VERSION="${UV_REQUIREMENT#==}"
      if [ "$ACTUAL_UV_VERSION" != "$EXPECTED_UV_VERSION" ]; then
        printf 'uv version mismatch: expected %s, actual %s
      ' "$EXPECTED_UV_VERSION" "$ACTUAL_UV_VERSION" >&2
        exit 1
      fi
    - apt-get update -qq
    - apt-get install -qq -y --no-install-recommends git openssh-client
    - apt-get install -qq -y --no-install-recommends binutils
    - git fetch --tags --force --prune --prune-tags origin
  script:
    - uv sync --locked --group quality --python python --no-python-downloads
    - uv run --locked --no-sync --python python --no-python-downloads nox -s quality
