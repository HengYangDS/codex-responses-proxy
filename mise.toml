min_version = "2026.9.11"

[settings]
idiomatic_version_file_enable_tools = []
legacy_version_file = false
locked = true
not_found_system_fallback = false
use_versions_host = false

[tool_alias]
# npm's package backend precedes the copy bundled with Node on every host.
npm = "npm:npm"

[tools]
# Language runtimes
node = "26.10.0"
npm = "12.1.0"
python = "3.14.7"

# Dependency management
uv = "0.12.21"

# Forge acquisition and security-sensitive artifact downloads
gh = "2.102.0"

# Specification and CI modeling
cue = "0.17.1"

# Structured data quality
"aqua:tamasfe/taplo" = "0.10.0"

# Static quality
"github:gitleaks/gitleaks" = "8.30.1"
"github:rhysd/actionlint" = "1.7.12"
"github:lycheeverse/lychee" = "lychee-v0.24.2"

[env]
UV_PROJECT_ENVIRONMENT = "{{config_root}}/.venv"
VIRTUAL_ENV = false
UV_PYTHON = false
PYTHONHOME = false
PYTHONPATH = false
PYTHONNOUSERSITE = "1"

[tasks."toolchain:verify"]
description = "Reject missing locked tools before any repository task runs"
run = [
  "mise which node",
  "mise which python",
  "mise which uv",
  "mise which npm",
  "mise which cue",
  "mise which taplo",
  "mise which gitleaks",
  "mise which actionlint",
  "mise which lychee",
  "mise which gh",
]

[tasks.bootstrap]
description = "Install the locked Python and Node development dependencies"
depends = ["toolchain:verify"]
run = [
  'uv sync --locked --all-groups --python "{{tools.python.path}}"',
  "npm ci --ignore-scripts",
  "npm audit signatures",
]

[tasks.quick]
description = "Run the editing feedback loop"
depends = ["toolchain:verify"]
run = 'uv run --locked --no-sync --python "{{tools.python.path}}" nox -s quick'

[tasks.check]
description = "Run repository governance, quality, and Python compatibility gates"
depends = ["toolchain:verify"]
run = 'uv run --locked --no-sync --python "{{tools.python.path}}" nox -s full'

[tasks.native]
description = "Verify the native artifact and real host service lifecycle"
depends = ["toolchain:verify"]
run = 'uv run --locked --no-sync --python "{{tools.python.path}}" nox -s release'

[tasks.release]
description = "Build and verify the native release asset without service registration"
depends = ["toolchain:verify"]
run = 'uv run --locked --no-sync --python "{{tools.python.path}}" nox -s release_asset'
