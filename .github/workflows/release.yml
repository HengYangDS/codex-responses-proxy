name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  require-verify:
    name: Require exact tag verification
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require exact successful Verify run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_TYPE" = tag
          deadline=$((SECONDS + 2400))
          while :; do
            runs=$(gh api --paginate --slurp \
              "repos/$GITHUB_REPOSITORY/actions/workflows/verify.yml/runs?branch=$GITHUB_REF_NAME&event=push&per_page=100")
            verdict=$(RUNS_JSON="$runs" python3 - "$GITHUB_REF_NAME" "$GITHUB_SHA" <<'PY'
          import json, os, sys
          tag, sha = sys.argv[1:]
          pages = json.loads(os.environ["RUNS_JSON"])
          matches = [
              run for page in pages for run in page.get("workflow_runs", [])
              if run.get("path") == ".github/workflows/verify.yml"
              and run.get("event") == "push"
              and run.get("head_branch") == tag
              and run.get("head_sha") == sha
          ]
          if len(matches) > 1:
              print("ambiguous")
          elif not matches or matches[0].get("status") != "completed":
              print("waiting")
          else:
              print(matches[0].get("conclusion") or "failed")
          PY
            )
            case "$verdict" in
              success) break ;;
              waiting)
                test "$SECONDS" -lt "$deadline" || {
                  echo "exact tag Verify run timed out" >&2
                  exit 1
                }
                sleep 10
                ;;
              *) echo "exact tag Verify run is not successful: $verdict" >&2; exit 1 ;;
            esac
          done

  verify-and-publish:
    name: Verify tag and publish record
    needs: require-verify
    # This repository-scoped runner accepts only trusted tag and manual release revisions.
    runs-on: [self-hosted, macOS, ARM64, codex-dmx-proxy-github-macos-arm64]
    timeout-minutes: 15
    steps:
      - name: Retain pre-checkout HEAD
        run: |
          set -euo pipefail
          ref=refs/codex-dmx-proxy/runner-checkout-retained
          git rev-parse --git-dir >/dev/null 2>&1 || exit 0
          git update-ref -d "$ref"
          git rev-parse --verify HEAD >/dev/null 2>&1 || exit 0
          git update-ref "$ref" HEAD
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Drop retained pre-checkout HEAD
        if: always()
        run: |
          git rev-parse --git-dir >/dev/null 2>&1 || exit 0
          git update-ref -d refs/codex-dmx-proxy/runner-checkout-retained
      - name: Fetch the exact annotated tag object
        env:
          SELECTED_TAG: ${{ github.ref_name }}
          VERIFIED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          case "$SELECTED_TAG" in v*) ;; *) echo "release requires a v* tag" >&2; exit 2 ;; esac
          git fetch --force --no-tags origin "+refs/tags/$SELECTED_TAG:refs/tags/$SELECTED_TAG"
          test "$(git cat-file -t "refs/tags/$SELECTED_TAG")" = tag
          target=$(git rev-parse "refs/tags/$SELECTED_TAG^{commit}")
          test "$target" = "$VERIFIED_SHA"
          git checkout --detach "$target"
      - name: Verify provider-native release tag
        env:
          SELECTED_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python=/opt/homebrew/bin/python3.14
          test -x "$python"
          case "$SELECTED_TAG" in v*) ;; *) echo "release requires a v* tag" >&2; exit 2 ;; esac
          test "$SELECTED_TAG" = "$(git describe --tags --exact-match HEAD)"
          sh scripts/check-release-tag-signature.sh . "$SELECTED_TAG" github
          "$python" scripts/check_release_metadata.py --provider github --tag "$SELECTED_TAG"
          "$python" scripts/check_markdown_presentation.py
      - name: Publish or verify exact GitHub release record
        env:
          GH_TOKEN: ${{ github.token }}
          SELECTED_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          expected_sha=$(git rev-parse 'HEAD^{commit}')
          expected_tag_oid=$(git rev-parse "$SELECTED_TAG^{tag}")
          releases=$(gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100")
          verdict=$(RELEASES_JSON="$releases" python3 - "$SELECTED_TAG" <<'PY'
          import json, os, sys
          tag = sys.argv[1]
          pages = json.loads(os.environ["RELEASES_JSON"])
          matches = [release for page in pages for release in page if release.get("tag_name") == tag]
          if len(matches) > 1:
              raise SystemExit("duplicate GitHub release records for exact tag")
          if not matches:
              print("missing")
              raise SystemExit(0)
          release = matches[0]
          expected = {"tag_name": tag, "name": f"Codex DMX Proxy {tag}", "draft": False, "prerelease": False}
          if (any(release.get(key) != value for key, value in expected.items())
                  or not isinstance(release.get("id"), int)
                  or not release.get("published_at")):
              raise SystemExit("existing GitHub release does not match exact release identity")
          print("matching")
          PY
          )
          case "$verdict" in
            matching) echo "GitHub release already matches: $SELECTED_TAG" ;;
            missing) ;;
            *) echo "unexpected GitHub release verdict: $verdict" >&2; exit 1 ;;
          esac
          ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$SELECTED_TAG")
          tag_oid=$(REF_JSON="$ref" python3 - <<'PY'
          import json, os
          object_ = json.loads(os.environ["REF_JSON"]).get("object", {})
          if object_.get("type") != "tag" or not object_.get("sha"):
              raise SystemExit("GitHub release tag is not an annotated provider tag")
          print(object_["sha"])
          PY
          )
          tag_object=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_oid")
          test "$tag_oid" = "$expected_tag_oid"
          TAG_JSON="$tag_object" python3 - "$SELECTED_TAG" "$tag_oid" "$expected_sha" <<'PY'
          import json, os, sys
          tag, oid, commit = sys.argv[1:]
          record = json.loads(os.environ["TAG_JSON"])
          target = record.get("object", {})
          if (record.get("tag"), record.get("sha"), target.get("type"), target.get("sha")) != (tag, oid, "commit", commit):
              raise SystemExit("GitHub release tag does not resolve to the checked-out commit")
          PY
          if [ "$verdict" = missing ]; then
            gh release create "$SELECTED_TAG" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --title "Codex DMX Proxy $SELECTED_TAG" --generate-notes
          fi
