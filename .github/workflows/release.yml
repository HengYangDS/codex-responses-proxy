name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  actions: read

env:
  CODEX_RESPONSES_PROXY_RELEASE_TAG_REMOTE: origin

concurrency:
  group: release-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  require-verify:
    name: Require exact tag verification
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    outputs:
      run-id: ${{ steps.verify.outputs.run-id }}
    steps:
      - name: Require exact successful Verify run
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_TYPE" = tag
          deadline=$((SECONDS + 2400))
          while :; do
            runs=$(gh api --paginate --slurp \
              "repos/$GITHUB_REPOSITORY/actions/workflows/verify.yml/runs?branch=$GITHUB_REF_NAME&event=push&per_page=100")
            verdict=$(RUNS_JSON="$runs" python3 - "$GITHUB_REF_NAME" "$GITHUB_SHA" <<'PY'
          import json, os, sys
          tag, sha = sys.argv[1:]
          pages = json.loads(os.environ["RUNS_JSON"])
          matches = [
              run for page in pages for run in page.get("workflow_runs", [])
              if run.get("path") == ".github/workflows/verify.yml"
              and run.get("event") == "push"
              and run.get("head_branch") == tag
              and run.get("head_sha") == sha
          ]
          if len(matches) > 1:
              print("ambiguous")
          elif not matches or matches[0].get("status") != "completed":
              print("waiting")
          else:
              print(matches[0].get("conclusion") or "failed")
          PY
            )
            case "$verdict" in
              success)
                run_id=$(RUNS_JSON="$runs" python3 - "$GITHUB_REF_NAME" "$GITHUB_SHA" <<'PY'
          import json, os, sys
          tag, sha = sys.argv[1:]
          pages = json.loads(os.environ["RUNS_JSON"])
          matches = [run for page in pages for run in page.get("workflow_runs", [])
                     if run.get("path") == ".github/workflows/verify.yml"
                     and run.get("event") == "push" and run.get("head_branch") == tag
                     and run.get("head_sha") == sha]
          if len(matches) != 1 or not isinstance(matches[0].get("id"), int):
              raise SystemExit("exact successful Verify run is ambiguous")
          print(matches[0]["id"])
          PY
                )
                echo "run-id=$run_id" >> "$GITHUB_OUTPUT"
                break ;;
              waiting)
                test "$SECONDS" -lt "$deadline" || {
                  echo "exact tag Verify run timed out" >&2
                  exit 1
                }
                sleep 10
                ;;
              *) echo "exact tag Verify run is not successful: $verdict" >&2; exit 1 ;;
            esac
          done

  verify-and-publish:
    name: Verify tag and publish record
    needs: require-verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-versions
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Install the complete locked tool environment
        run: uv sync --locked --all-groups
      - name: Fetch the exact annotated tag object
        env:
          SELECTED_TAG: ${{ github.ref_name }}
          VERIFIED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          case "$SELECTED_TAG" in v*) ;; *) echo "release requires a v* tag" >&2; exit 2 ;; esac
          git fetch --force --no-tags origin "+refs/tags/$SELECTED_TAG:refs/tags/$SELECTED_TAG"
          test "$(git cat-file -t "refs/tags/$SELECTED_TAG")" = tag
          target=$(git rev-parse "refs/tags/$SELECTED_TAG^{commit}")
          test "$target" = "$VERIFIED_SHA"
          git checkout --detach "$target"
      - name: Verify provider-native release tag
        env:
          SELECTED_TAG: ${{ github.ref_name }}
          CODEX_RESPONSES_PROXY_GITHUB_TAG_TRUST: ${{ secrets.CODEX_RESPONSES_PROXY_GITHUB_TAG_TRUST }}
        run: |
          set -euo pipefail
          case "$SELECTED_TAG" in v*) ;; *) echo "release requires a v* tag" >&2; exit 2 ;; esac
          test "$SELECTED_TAG" = "$(git describe --tags --exact-match HEAD)"
          test -n "$CODEX_RESPONSES_PROXY_GITHUB_TAG_TRUST"
          anchor="$RUNNER_TEMP/github-tag-allowed-signers"
          printf '%s\n' "$CODEX_RESPONSES_PROXY_GITHUB_TAG_TRUST" > "$anchor"
          chmod 600 "$anchor"
          CODEX_RESPONSES_PROXY_RELEASE_ALLOWED_SIGNERS="$anchor" \
            sh tools/forge/check-tag-signature.sh . "$SELECTED_TAG" github
          uv run --locked --no-sync python tools/release/metadata.py --provider github --tag "$SELECTED_TAG"
          uv run --locked --no-sync python tools/quality/markdown.py
      - name: Publish or verify exact GitHub release record
        env:
          GH_TOKEN: ${{ github.token }}
          SELECTED_TAG: ${{ github.ref_name }}
          VERIFIED_RUN_ID: ${{ needs.require-verify.outputs.run-id }}
          RELEASE_ASSET_TRUST: ${{ secrets.CODEX_RESPONSES_PROXY_RELEASE_ASSET_TRUST }}
        run: |
          set -euo pipefail
          expected_sha=$(git rev-parse 'HEAD^{commit}')
          expected_tag_oid=$(git rev-parse "$SELECTED_TAG^{tag}")
          releases=$(gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100")
          verdict=$(RELEASES_JSON="$releases" python3 - "$SELECTED_TAG" <<'PY'
          import json, os, sys
          tag = sys.argv[1]
          pages = json.loads(os.environ["RELEASES_JSON"])
          matches = [release for page in pages for release in page if release.get("tag_name") == tag]
          if len(matches) > 1:
              raise SystemExit("duplicate GitHub release records for exact tag")
          if not matches:
              print("missing")
              raise SystemExit(0)
          release = matches[0]
          expected = {"tag_name": tag, "name": f"Codex Responses Proxy {tag}", "draft": False, "prerelease": False}
          if (any(release.get(key) != value for key, value in expected.items())
                  or not isinstance(release.get("id"), int)
                  or not release.get("published_at")):
              raise SystemExit("existing GitHub release does not match exact release identity")
          print("matching")
          PY
          )
          case "$verdict" in
            matching) echo "GitHub release already matches: $SELECTED_TAG" ;;
            missing) ;;
            *) echo "unexpected GitHub release verdict: $verdict" >&2; exit 1 ;;
          esac
          ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$SELECTED_TAG")
          tag_oid=$(REF_JSON="$ref" python3 - <<'PY'
          import json, os
          object_ = json.loads(os.environ["REF_JSON"]).get("object", {})
          if object_.get("type") != "tag" or not object_.get("sha"):
              raise SystemExit("GitHub release tag is not an annotated provider tag")
          print(object_["sha"])
          PY
          )
          tag_object=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_oid")
          test "$tag_oid" = "$expected_tag_oid"
          TAG_JSON="$tag_object" python3 - "$SELECTED_TAG" "$tag_oid" "$expected_sha" <<'PY'
          import json, os, sys
          tag, oid, commit = sys.argv[1:]
          record = json.loads(os.environ["TAG_JSON"])
          target = record.get("object", {})
          if (record.get("tag"), record.get("sha"), target.get("type"), target.get("sha")) != (tag, oid, "commit", commit):
              raise SystemExit("GitHub release tag does not resolve to the checked-out commit")
          PY
          assets="$RUNNER_TEMP/release-assets"
          gh run download "$VERIFIED_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name release-assets --dir "$assets"
          anchor="$RUNNER_TEMP/release-asset-trust"
          printf '%s\n' "$RELEASE_ASSET_TRUST" > "$anchor"
          principal=$(ssh-keygen -Y find-principals -s "$assets/SHA256SUMS.sig" \
            -f "$anchor" < "$assets/SHA256SUMS")
          test "$principal" = codex-responses-proxy-release
          ssh-keygen -Y verify -f "$anchor" -I "$principal" \
            -n codex-responses-proxy-release -s "$assets/SHA256SUMS.sig" \
            < "$assets/SHA256SUMS"
          uv run --locked --no-sync python tools/release/assemble_assets.py --verify "$assets"
          if [ "$verdict" = missing ]; then
            gh release create "$SELECTED_TAG" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --title "Codex Responses Proxy $SELECTED_TAG" --generate-notes \
              "$assets"/*
          fi
          downloaded="$RUNNER_TEMP/downloaded-assets"
          mkdir -p "$downloaded"
          gh release download "$SELECTED_TAG" --repo "$GITHUB_REPOSITORY" --dir "$downloaded" \
            --pattern 'codex-responses-proxy-*' --pattern 'SHA256SUMS*'
          uv run --locked --no-sync python tools/release/assemble_assets.py --verify "$downloaded"
          diff -qr "$assets" "$downloaded"
