name: Release

on:
  workflow_run:
    workflows: [Verify]
    types: [completed]

permissions:
  contents: write
  actions: read

env:
  CODEX_RESPONSES_PROXY_RELEASE_TAG_REMOTE: origin
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

concurrency:
  group: release-${{ github.repository }}-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  verify-and-publish:
    name: Verify tag and publish record
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-release
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Install the complete locked tool environment
        run: uv sync --locked --all-groups
      - name: Download the exact pre-signed release bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "${{ github.event.workflow_run.id }}" --name release-assets --dir "$RUNNER_TEMP/github-release/source"
      - name: Publish or verify exact GitHub release record
        env:
          GH_TOKEN: ${{ github.token }}
          CODEX_RESPONSES_PROXY_GITHUB_TAG_TRUST: ${{ secrets.CODEX_RESPONSES_PROXY_GITHUB_TAG_TRUST }}
          RELEASE_ASSET_TRUST: ${{ secrets.CODEX_RESPONSES_PROXY_RELEASE_ASSET_TRUST }}
        run: uv run --locked --no-sync python -m tools.release.publish_github publish --repository "$GITHUB_REPOSITORY" --tag "${{ github.event.workflow_run.head_branch }}" --commit-oid "${{ github.event.workflow_run.head_sha }}" --assets "$RUNNER_TEMP/github-release/source" --workspace "$RUNNER_TEMP/github-release/work"
