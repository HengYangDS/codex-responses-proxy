name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  actions: read

env:
  CODEX_RESPONSES_PROXY_RELEASE_TAG_REMOTE: origin
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

concurrency:
  group: release-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  require-verify:
    name: Require exact tag verification
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    outputs:
      run-id: ${{ steps.verify.outputs.run-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-versions
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Install the locked publication tool environment
        run: uv sync --locked --all-groups
      - name: Require exact successful Verify run
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --locked --no-sync python -m tools.release.publish_github wait-verify --repository "$GITHUB_REPOSITORY" --tag "$GITHUB_REF_NAME" --commit-oid "$GITHUB_SHA" --output "$GITHUB_OUTPUT"

  verify-and-publish:
    name: Verify tag and publish record
    needs: require-verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-versions
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Install the complete locked tool environment
        run: uv sync --locked --all-groups
      - name: Publish or verify exact GitHub release record
        env:
          GH_TOKEN: ${{ github.token }}
          CODEX_RESPONSES_PROXY_GITHUB_TAG_TRUST: ${{ secrets.CODEX_RESPONSES_PROXY_GITHUB_TAG_TRUST }}
          RELEASE_ASSET_TRUST: ${{ secrets.CODEX_RESPONSES_PROXY_RELEASE_ASSET_TRUST }}
        run: uv run --locked --no-sync python -m tools.release.publish_github publish --repository "$GITHUB_REPOSITORY" --tag "$GITHUB_REF_NAME" --commit-oid "$GITHUB_SHA" --run-id "${{ needs.require-verify.outputs.run-id }}" --workspace "$RUNNER_TEMP/github-release"
