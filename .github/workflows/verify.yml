name: Verify

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    # This self-hosted runner accepts only trusted main, tag, and manual revisions.
    runs-on: [self-hosted, macOS, ARM64, codex-dmx-proxy-github-macos-arm64]
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Compile and test
        run: |
          set -euo pipefail
          python="/opt/homebrew/bin/python${{ matrix.python-version }}"
          test -x "$python"
          "$python" -m compileall -q codex_dmx_proxy watchdog install.py uninstall.py control.py governance.py tests scripts
          "$python" scripts/run-python-tests.py

  python-windows:
    name: Python ${{ matrix.python-version }} (Windows)
    runs-on: windows-2025
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile and test
        shell: bash
        run: |
          set -euo pipefail
          python --version
          python -m compileall -q codex_dmx_proxy watchdog install.py uninstall.py control.py governance.py tests scripts
          python scripts/run-python-tests.py

  governance:
    name: Governance and presentation
    # This self-hosted runner accepts only trusted main, tag, and manual revisions.
    runs-on: [self-hosted, macOS, ARM64, codex-dmx-proxy-github-macos-arm64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Fetch the exact annotated tag object
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin "+refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          test "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" = tag
          test "$(git rev-parse "refs/tags/$GITHUB_REF_NAME^{commit}")" = "$GITHUB_SHA"
          git checkout --detach "$GITHUB_SHA"
      - name: Verify release and source contracts
        run: |
          set -euo pipefail
          python=/opt/homebrew/bin/python3.14
          test -x "$python"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            "$python" scripts/check_release_metadata.py --provider github --tag "$GITHUB_REF_NAME"
          else
            "$python" scripts/check_release_metadata.py --provider github
          fi
          "$python" scripts/check_markdown_presentation.py
          "$python" scripts/check_quality.py
          sh scripts/test-github-actions-contract.sh
          sh scripts/test-github-release-workflow.sh
          sh scripts/test-github-provider-projection.sh
          sh scripts/test-gitlab-provider-projection.sh
          sh scripts/test-gitlab-tagging.sh
          sh scripts/test-github-tagging.sh
          sh scripts/test-publish-gitlab-release.sh

  python-quality:
    name: Python quality
    runs-on: [self-hosted, macOS, ARM64, codex-dmx-proxy-github-macos-arm64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Verify lint, format, types, structure, docstrings, and product branch coverage
        run: |
          set -euo pipefail
          python=/opt/homebrew/bin/python3.12
          tools="$RUNNER_TEMP/codex-dmx-proxy-quality-tools"
          "$python" -m venv "$tools"
          "$tools/bin/python" -m pip install --disable-pip-version-check --no-cache-dir \
            ruff==0.16.0 ty==0.0.64 coverage==7.13.5
          ruff="$tools/bin/ruff"
          ty="$tools/bin/ty"
          test "$($ruff --version)" = "ruff 0.16.0"
          case "$($ty --version)" in
            "ty 0.0.64"|"ty 0.0.64 "*) ;;
            *) exit 1 ;;
          esac
          PYTHON="$tools/bin/python" RUFF="$ruff" TY="$ty" sh scripts/run-python-quality.sh
