name: Verify

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CODEX_RESPONSES_PROXY_RELEASE_TAG_REMOTE: origin

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-matrix:
    name: Resolve supported Python versions
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      versions: ${{ steps.versions.outputs.value }}
      floor: ${{ steps.versions.outputs.floor }}
      latest: ${{ steps.versions.outputs.latest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read the repository Python matrix
        id: versions
        shell: python
        run: |
          import json
          import os
          from pathlib import Path

          versions = Path(".python-versions").read_text(encoding="utf-8").splitlines()
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              print(f"value={json.dumps(versions)}", file=output)
              print(f"floor={versions[0]}", file=output)
              print(f"latest={versions[-1]}", file=output)

  python:
    name: Python ${{ matrix.python-version }}
    needs: python-matrix
    runs-on: macos-26
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(needs.python-matrix.outputs.versions) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Compile and test
        run: |
          set -euo pipefail
          python --version
          uv sync --locked --only-group quality
          uv run --locked --no-sync nox -s "tests-${{ matrix.python-version }}"

  python-windows:
    name: Python ${{ matrix.python-version }} (Windows)
    needs: python-matrix
    runs-on: windows-2025
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(needs.python-matrix.outputs.versions) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Compile and test
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python --version
          uv sync --locked --only-group quality
          uv run --locked --no-sync nox -s "tests-${{ matrix.python-version }}"

  governance:
    name: Governance and presentation
    needs: python-matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ needs.python-matrix.outputs.latest }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Install the complete locked tool environment
        run: uv sync --locked --all-groups
      - name: Fetch the exact annotated tag object
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin "+refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          test "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" = tag
          test "$(git rev-parse "refs/tags/$GITHUB_REF_NAME^{commit}")" = "$GITHUB_SHA"
          git checkout --detach "$GITHUB_SHA"
      - name: Verify release and source contracts
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            uv run --locked --no-sync python tools/release/metadata.py --provider github --tag "$GITHUB_REF_NAME"
          else
            uv run --locked --no-sync python tools/release/metadata.py --provider github
          fi
          uv run --locked --no-sync python tools/quality/markdown.py
          uv run --locked --no-sync python -m tools.quality.repository
          sh tests/forge/contracts/test-github-actions.sh
          sh tests/forge/contracts/test-github-release.sh
          sh tests/forge/contracts/test-gitlab-tagging.sh
          sh tests/forge/contracts/test-github-tagging.sh
          sh tests/release/contracts/test-publish-gitlab.sh

  python-quality:
    name: Python quality
    needs: python-matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ needs.python-matrix.outputs.floor }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Verify lint, format, types, structure, docstrings, and product branch coverage
        run: |
          set -euo pipefail
          uv sync --locked --only-group quality
          uv run --locked --no-sync nox -s quality

  native-assets:
    name: Native asset (${{ matrix.platform }})
    if: github.ref_type == 'tag'
    needs: python-matrix
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
          - platform: macos-arm64
            runner: macos-26
          - platform: windows-x86_64
            runner: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ needs.python-matrix.outputs.latest }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Build and accept the native release asset
        shell: bash
        run: |
          set -euo pipefail
          uv sync --locked --only-group quality
          uv run --locked --no-sync nox -s release -- "$RUNNER_TEMP/native-assets"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-${{ matrix.platform }}
          path: ${{ runner.temp }}/native-assets
          if-no-files-found: error
          retention-days: 7

  release-assets:
    name: Release assets
    if: github.ref_type == 'tag'
    needs: [python-matrix, native-assets]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ needs.python-matrix.outputs.latest }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: native-*
          path: ${{ runner.temp }}/native
      - name: Install the complete locked tool environment
        run: uv sync --locked --all-groups
      - name: Assemble, sign, and verify the release set
        env:
          RELEASE_ASSET_SIGNING_KEY: ${{ secrets.CODEX_RESPONSES_PROXY_RELEASE_ASSET_SIGNING_KEY }}
          RELEASE_ASSET_TRUST: ${{ secrets.CODEX_RESPONSES_PROXY_RELEASE_ASSET_TRUST }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_ASSET_SIGNING_KEY"
          test -n "$RELEASE_ASSET_TRUST"
          release="$RUNNER_TEMP/release-assets"
          uv run --locked --no-sync python tools/release/assemble_assets.py \
            --input "$RUNNER_TEMP/native/native-linux-x86_64" \
            --input "$RUNNER_TEMP/native/native-macos-arm64" \
            --input "$RUNNER_TEMP/native/native-windows-x86_64" \
            --output "$release"
          key="$RUNNER_TEMP/release-asset-key"
          anchor="$RUNNER_TEMP/release-asset-trust"
          printf '%s\n' "$RELEASE_ASSET_SIGNING_KEY" > "$key"
          printf '%s\n' "$RELEASE_ASSET_TRUST" > "$anchor"
          chmod 600 "$key" "$anchor"
          (cd "$release" && ssh-keygen -Y sign -q -f "$key" \
            -n codex-responses-proxy-release SHA256SUMS)
          principal=$(ssh-keygen -Y find-principals -s "$release/SHA256SUMS.sig" \
            -f "$anchor" < "$release/SHA256SUMS")
          test "$principal" = codex-responses-proxy-release
          ssh-keygen -Y verify -f "$anchor" -I "$principal" \
            -n codex-responses-proxy-release -s "$release/SHA256SUMS.sig" \
            < "$release/SHA256SUMS"
          uv run --locked --no-sync python tools/release/assemble_assets.py --verify "$release"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          path: ${{ runner.temp }}/release-assets
          if-no-files-found: error
          retention-days: 7
