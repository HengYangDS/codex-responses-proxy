name: Verify

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: macos-26
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile and test
        run: |
          set -euo pipefail
          python --version
          python tools/quality/tests.py --compile

  python-windows:
    name: Python ${{ matrix.python-version }} (Windows)
    runs-on: windows-2025
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile and test
        shell: bash
        run: |
          set -euo pipefail
          python --version
          python tools/quality/tests.py --compile

  governance:
    name: Governance and presentation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Fetch the exact annotated tag object
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin "+refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          test "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" = tag
          test "$(git rev-parse "refs/tags/$GITHUB_REF_NAME^{commit}")" = "$GITHUB_SHA"
          git checkout --detach "$GITHUB_SHA"
      - name: Verify release and source contracts
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            python tools/release/metadata.py --provider github --tag "$GITHUB_REF_NAME"
          else
            python tools/release/metadata.py --provider github
          fi
          python tools/quality/markdown.py
          python tools/quality/repository.py
          sh tests/forge/contracts/test-github-actions.sh
          sh tests/forge/contracts/test-github-release.sh
          sh tests/forge/contracts/test-gitlab-tagging.sh
          sh tests/forge/contracts/test-github-tagging.sh
          sh tests/release/contracts/test-publish-gitlab.sh

  python-quality:
    name: Python quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Verify lint, format, types, structure, docstrings, and product branch coverage
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir uv==0.12.1
          PYTHON=python sh tools/quality/run.sh
