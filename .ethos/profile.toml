profile_id = "codex-responses-proxy"

[openspec]
material_paths = [
  ".ethos/**",
  ".github/**",
  ".gitlab-ci.yml",
  "AGENTS.md",
  "CHANGELOG.md",
  "CONTRIBUTING.md",
  "README.md",
  "VERSION",
  ".python-versions",
  "docs/**",
  "evidence/**",
  "noxfile.py",
  "openspec/**",
  "packaging/**",
  "pyproject.toml",
  "src/**",
  "tests/**",
  "tools/**",
  "uv.lock",
]

[proof]
code_correctness_gates = ["python-quality", "python-matrix"]

[proof.code_correctness_map]
behavior = "python-matrix"
static-analysis = "python-quality"

[[proof.gates]]
id = "python-quality"
kind = "static"
command = [
  "uv",
  "run",
  "--locked",
  "--no-sync",
  "nox",
  "-s",
  "quality",
]
dimensions = ["static-analysis", "types", "structure", "coverage"]
execution_mode = "subprocess"
evidence_class = "proof"
trust_bearing = true
tool_adapter = "repository-native"
network_policy = "offline"

[[proof.gates]]
id = "python-matrix"
kind = "test"
command = [
  "uv",
  "run",
  "--locked",
  "--no-sync",
  "nox",
  "-s",
  "tests-3.12",
  "tests-3.13",
  "tests-3.14",
]
dimensions = ["behavior", "test", "platform"]
execution_mode = "subprocess"
evidence_class = "proof"
trust_bearing = true
tool_adapter = "repository-native"
network_policy = "offline"
