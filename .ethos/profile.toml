profile_id = "codex-responses-proxy"

[openspec]
material_paths = ["**"]

[proof]
code_correctness_gates = ["python-quality", "python-matrix"]

[proof.code_correctness_map]
behavior = "python-matrix"
static-analysis = "python-quality"

[[proof.gates]]
id = "python-quality"
kind = "static"
verification_providers = ["ethos.adapters.gates.code_quality:static_report"]
command = [
  "mise",
  "exec",
  "--locked",
  "--",
  "uv",
  "run",
  "--locked",
  "--no-sync",
  "--python",
  "python",
  "nox",
  "-s",
  "quality",
]
dimensions = ["static-analysis", "types", "structure", "coverage"]
execution_mode = "verified-command"
evidence_class = "proof"
trust_bearing = true
tool_adapter = "ethos"
network_policy = "offline"
writes_files = true

[[proof.gates]]
id = "python-matrix"
kind = "test"
verification_providers = ["ethos.adapters.gates.code_quality:behavior_report"]
command = [
  "mise",
  "exec",
  "--locked",
  "--",
  "uv",
  "run",
  "--locked",
  "--no-sync",
  "--python",
  "python",
  "nox",
  "-s",
  "tests",
]
dimensions = ["behavior", "test"]
execution_mode = "verified-command"
evidence_class = "proof"
trust_bearing = true
tool_adapter = "ethos"
network_policy = "offline"
writes_files = true
