profile_id = "codex-responses-proxy"

[openspec]
material_paths = [
  ".ethos/**",
  ".github/**",
  ".gitlab-ci.yml",
  "CHANGELOG.md",
  "CONTRIBUTING.md",
  "VERSION",
  "codex_responses_proxy/**",
  "docs/governance/**",
  "openspec/**",
  "pyproject.toml",
  "tools/**",
  "tests/**",
  "watchdog/**",
  "*.py",
]

[proof]
code_correctness_gates = ["python-quality", "platform-matrix"]

[proof.code_correctness_map]
behavior = "platform-matrix"
static-analysis = "python-quality"

[[proof.gates]]
id = "python-quality"
kind = "static"
command = [
  "sh",
  "-c",
  "PYTHON=python3.12 RUFF=ruff TY=ty sh tools/quality/run.sh",
]
dimensions = ["static-analysis", "types", "structure", "coverage"]
execution_mode = "subprocess"
evidence_class = "proof"
trust_bearing = true
tool_adapter = "repository-native"
network_policy = "offline"

[[proof.gates]]
id = "platform-matrix"
kind = "test"
command = [
  "sh",
  "-c",
  "for py in python3.12 python3.13 python3.14; do \"$py\" tools/quality/tests.py --compile || exit; done",
]
dimensions = ["behavior", "test", "platform"]
execution_mode = "subprocess"
evidence_class = "proof"
trust_bearing = true
tool_adapter = "repository-native"
network_policy = "offline"
